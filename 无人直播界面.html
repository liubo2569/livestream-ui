<style>

  .dh-avatar-wrap { position: relative; width: 220px; border-radius: 16px; overflow: hidden; border: none; background: transparent; box-shadow: none; animation: dh-float 3s ease-in-out infinite; } .dh-avatar-wrap img { width: 100%; height: auto; display: block; }

  .dh-speaking-bubble.active { display: block; }

  .dh-product-overlay { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; pointer-events: auto; }

<body>
<div class="container">
