<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>livestream-ui - 无人直播系统演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #eef1f6 0%, #e4e9f2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    padding: 24px;
  }
  .container { width: 640px; max-width: 100%; }
  .header { text-align: center; margin-bottom: 36px; }
  .header h1 { font-size: 26px; color: #1e3246; letter-spacing: 2px; }
  .header p { font-size: 13px; color: #787896; margin-top: 8px; }
  .header .bar { width: 60px; height: 3px; background: linear-gradient(90deg, #826ea0, #b4d2e6); margin: 12px auto 0; border-radius: 2px; }
  .cards { display: flex; flex-direction: column; gap: 16px; }
  a.card {
    display: flex; align-items: center; gap: 18px;
    background: #ffffff; border-radius: 14px; padding: 22px 24px;
    text-decoration: none; color: inherit;
    box-shadow: 0 2px 10px rgba(30,50,70,0.06);
    border: 1px solid rgba(0,0,0,0.05);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(30,50,70,0.12); }
  .card .icon { font-size: 34px; width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .card.c1 .icon { background: #0a0a0f; }
  .card.c2 .icon { background: linear-gradient(135deg, #826ea0, #b4d2e6); }
  .card h2 { font-size: 17px; color: #1e3246; margin-bottom: 4px; }
  .card p { font-size: 13px; color: #8a8aa0; line-height: 1.5; }
  .card .arrow { margin-left: auto; color: #b0b6c4; font-size: 20px; }
  .footer { text-align: center; margin-top: 32px; font-size: 12px; color: #a0a4b4; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>无人直播系统 · 演示站点</h1>
      <p>Rural Revitalization Unmanned Livestream System</p>
      <div class="bar"></div>
    </div>
    <div class="cards">
      <a class="card c1" href="./无人直播界面.html">
        <div class="icon">📹</div>
        <div>
          <h2>无人直播界面</h2>
          <p>数字人直播控制台：直播画面、弹幕、商品卡片与数字人互动演示</p>
        </div>
        <div class="arrow">›</div>
      </a>
      <a class="card c2" href="./技术路线图.html">
        <div class="icon">🗺️</div>
        <div>
          <h2>技术路线图</h2>
          <p>乡村振兴助农无人直播系统的整体技术架构与分层设计</p>
        </div>
        <div class="arrow">›</div>
      </a>
    </div>
    <div class="footer">livestream-ui · Deployed on GitHub Pages</div>
  </div>
</body>
</html>
